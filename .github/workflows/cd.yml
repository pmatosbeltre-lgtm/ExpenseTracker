name: CD - Despliegue Continuo a Azure

on:
  push:
    branches: [ "testing", "main" ]

jobs:
  deploy:
    name: Desplegar a Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Iniciar sesión en Azure con Service Principal
      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Iniciar sesión en Azure Container Registry (ACR)
      - name: Iniciar sesión en ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Construir y subir imagen del Backend
      - name: Build & Push Backend
        run: |
          IMAGE_TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/gastos-backend:$IMAGE_TAG ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/gastos-backend:$IMAGE_TAG

      # 5. Construir y subir imagen del Frontend
      - name: Build & Push Frontend
        run: |
          IMAGE_TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/gastos-frontend:$IMAGE_TAG ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/gastos-frontend:$IMAGE_TAG

      # 6. Desplegar según la rama activa
      - name: Desplegar Backend en Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ github.ref == 'refs/heads/main' && 'app-backend-main' || 'app-backend-testing' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/gastos-backend:${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}

      - name: Desplegar Frontend en Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ github.ref == 'refs/heads/main' && 'app-frontend-main' || 'app-frontend-testing' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/gastos-frontend:${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}